<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
    content="width=device-width, 
    initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <center>
        <h1>Formulário de Cadastro</h1>
    </center>
    <p style="font-family: 'Times New Roman', Times, serif; font-size: 20px; color: red;">
    Realize o cadastro e concorra a premios</p>
    <form>
        <label>Nome Completo</label>
        <input type="text"
        placeholder="Insira seu nome" required/>
        <br>
        <label>Data de Nascimento</label>
        <input type="date"/>
        <br><br>
        <label>CPF</label>
        <input type="number"/>
        <br><br>
        <label>Você nos indicaria?</label> 
        <input type="number" min="1" max="5" />
        <br><br>
        <label>Email</label>
        <input type="email" placeholder="Insira seu email" required/>
        <br><br>
        <label>Cor favorita</label>
        <input type="color"/>
        <br><br>
        <label>Em qual volume você ouve música (0 a 100)</label>
        <input id="volume" type="range" min="0" max="100" value="50"
        oninput="atualizarVolume(this.value)" style="accent-color: #ff0000;"/>
        <span id="valor-volume">50</span>
        <br><br>
        <fieldset>
            <legend>Gênero</legend>
            <input type="radio" name = "genero" />
            <label>Masculino</label>
            <input type="radio" name = "genero" />
            <label>Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Monte seu lanche! 🍔</legend>
            <input type="checkbox" name = "salada" 
            style="accent-color: #279e0c;" />
            <label>Salada</label>
            <input type="checkbox" name = "hamburguer"
            style="accent-color: #643500;" />
            <label>Hambúrguer</label>
            <input type="checkbox" name = "bacon"
            style="accent-color: #c70000eb;" />
            <label>Bacon</label>
            <input type="checkbox" name = "maionese"
            style="accent-color: #7ef369;" />
            <label>Maionese caseira da Casa</label>
            <br>
            <input type="checkbox" name = "maionese"
            style="accent-color: #000000;" />
            <label>Você 🫵</label>
        </fieldset>
        <br><br>
        <label>Informações Adicionais</label>
        <textarea id="info"></textarea>
        <br><br>
        <label>Senha</label>
        <input type="password" placeholder="Insira sua senha" required/>
        <br><br>
        <label>Informe sua cidade</label>
        <select id="cidade">
            <option>Jaguariúna</option>
            <option>Pedreira</option>
            <option>Amparo</option>
            <option>Arcadas</option>
            <option>Bragança Paulista</option>
            <option>Serra Negra</option>
        </select>
        <br><br>
        <input type="reset" value="Limpar form"/>
        <input type="submit" value="Enviar form"/>
    </form>

    <script>
        function atualizarVolume(valor) {
            document.getElementById('valor-volume').textContent = valor;
        }
    </script>

</body>
</html>
