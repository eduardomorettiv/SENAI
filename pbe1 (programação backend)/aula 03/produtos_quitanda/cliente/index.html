<html lang="en">
    <head>
        <title>Pedidos Quitanda</title>
    </head>
    <body>
        <center>
            <H1>Novo Pedido</H1>
            <form action="http://localhost:3000" method="post">
                <input type="number" placeholder="Identificacao" name="id" required>
                <br><br>
                <input type="text" placeholder="Nome do produto" name="nome" required>
                <br><br>
                <select name="unidade" required>
                    <option value="kg">Kg</option>
                    <option value="Unidade">Unidade</option>
                </select><br><br>
                <input type="number" step="0.01" placeholder="Preco unitario" name="precoUnitario" required>
                <br><br>
                <input type="number" placeholder="Quantidade" name="quantidade" required>
                <br><br>
                <button type="reset" style="background-color: rgb(255, 129, 129);">Limpar</button>
                <button type="submit" style="background-color: rgb(174, 255, 154);">Enviar</button>
            </form>
        </center>
    </body>
</html>
