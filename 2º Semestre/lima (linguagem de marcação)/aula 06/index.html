<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- aluno -->
    <main class="container" style="background-color: lightblue;">
        <h1>Área do Aluno</h1>

        <div class="card">

            <h1>Cadastro do Aluno</h1>

            <p>Preencha os dados abaixo</p>

            <input
                type="text"
                id="nome"
                placeholder="Nome"
            >

            <input
                type="email"
                id="email"
                placeholder="E-mail"
            >

            <input
                type="text"
                id="matricula"
                placeholder="matricula"
            >

            <button id="salvar">
                Salvar
            </button>

        </div>

        <div class="card tabela-container">

            <h2>Cadastros dos alunos</h2>

            <table>

                <thead>

                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Matricula</th>
                    </tr>

                </thead>

                <tbody id="tabela">

                </tbody>

            </table>

        </div>

    </main>

    <!-- professor -->
    <main class="container" style="background-color: lightcoral;">
        <h1>Área do Professor</h1>

        <div class="card">

            <h1>Cadastro do Professor</h1>

            <p>Preencha os dados abaixo</p>

            <input
                type="text"
                id="nome2"
                placeholder="Nome"
            >

            <input
                type="email"
                id="email2"
                placeholder="E-mail"
            >

            <input
                type="text"
                id="disciplina"
                placeholder="Disciplina"
            >

            <button id="salvar2">
                Salvar
            </button>

        </div>

        <div class="card tabela-container">

            <h2>Cadastros dos professores</h2>

            <table>

                <thead>

                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Disciplina</th>
                    </tr>

                </thead>

                <tbody id="tabela2">

                </tbody>

            </table>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
